[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "barrassons"
version = "0.1.0"
description = "Assistant de développement AI2AI dans le terminal"
requires-python = ">=3.10"

[project.scripts]
barrassons = "barrassons.cli:main"

[tool.setuptools.packages.find]
include = ["barrassons*"]