[package]
name = "ai2ai-markdown"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
comrak = { version = "=0.56.0", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
