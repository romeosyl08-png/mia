services:
  - type: web
    name: ai-2ai
    runtime: python
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: ai-2ai-files
      mountPath: /var/data
      sizeGB: 1
    buildCommand: pip install -r requirements.txt && python scripts/build_retrieval_native.py --optional && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate --noinput && python manage.py seed_providers && python manage.py sync_provider_keys && python manage.py sync_openrouter_models --allow-stale && exec python manage.py run_services
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-2ai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FERNET_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: PRIVATE_MEDIA_ROOT
        value: /var/data/private_media
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAYDUNYA_MASTER_KEY
        sync: false
      - key: PAYDUNYA_PRIVATE_KEY
        sync: false
      - key: PAYDUNYA_TOKEN
        sync: false
      - key: DEFAULT_CURRENCY
        value: XOF
      - key: EUR_PER_USD
        value: "0.92"
      - key: IP_CURRENCY_LOOKUP_ENABLED
        value: "True"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        value: "https://mia-vkl1.onrender.com"
      - key: GOOGLE_REDIRECT_URI
        value: "https://mia-vkl1.onrender.com/accounts/google/login/callback/"
      - key: REDIS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TOGETHER_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FAL_API_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: APIFRAME_API_KEY
        sync: false
databases:
  - name: ai-2ai-db
    databaseName: ai_2ai
    user: ai_2ai
    plan: free
