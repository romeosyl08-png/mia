services:
  - type: web
    name: ai-2ai
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate --noinput --verbosity 2 && exec gunicorn ai_2ai.wsgi:application --bind 0.0.0.0:$PORT 
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-2ai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FERNET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: API_COMPATIBLE_KEY
        sync: false

databases:
  - name: ai-2ai-db
    databaseName: ai_2ai
    user: ai_2ai
    plan: free
