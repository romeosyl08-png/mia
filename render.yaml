services:
  - type: web
    name: ai-2ai
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate --noinput && python manage.py seed_providers && python manage.py sync_provider_keys && exec gunicorn ai_2ai.wsgi:application --bind 0.0.0.0:$PORT --timeout 120 --worker-class gthread --threads 4
      - key: DATABASE_URL
        fromDatabase:
          name: ai-2ai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FERNET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: API_COMPATIBLE_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TOGETHER_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
        fromService:
          type: redis
          name: ai-2ai-redis
          property: connectionString
databases:
  - name: ai-2ai-db
    databaseName: ai_2ai
    user: ai_2ai
    plan: free
