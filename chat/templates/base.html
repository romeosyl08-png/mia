<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Le Comptoir — chatbot personnalisable{% endblock %}</title>
<link id="botFavicon" rel="icon" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
{% load static %}

<link rel="stylesheet" href="{% static 'app/css/style.css' %}">
{% block extra_head %}
{% endblock %}
</head>
<body data-theme="light">
{% block body %}
{% endblock %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.0/purify.min.js"></script>


    <!-- APPARENCE GLOBALE -->
      {% if chat_config %}{{ chat_config|json_script:"chat-config" }}{% endif %}
    <script src="{% static 'app/js/appearance.js' %}"></script>
    <script src="{% static 'app/js/script.js' %}"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
