<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Le Comptoir — chatbot personnalisable{% endblock %}</title>
<link id="botFavicon" rel="icon" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#242424;
    --paper:#FFFFFF;
    --panel:#FAFAF9;
    --amber:#E56B45;
    --amber-deep:#C95635;
    --teal:#5F7C70;
    --line:#E7E5E4;
    --danger:#B4483A;
    --sidebar:#F7F7F5;
    --hover:#ECEBE8;
    --user-bubble:#F1F0EE;
    --composer-border:#D9D7D2;
    --shadow:#0000000d;
    --accent-ink:#211914;
    --accent: var(--amber);
    --accent-hover: var(--amber-deep);
    --radius: 12px;
    --theme-ink: #242424;
    --theme-paper: #FFFFFF;
    --theme-panel: #FAFAF9;
    --theme-line: #E7E5E4;
  }
  [data-theme="dark"]{
    --ink:#F5F5F4;
    --paper:#20201F;
    --panel:#292927;
    --line:#454542;
    --sidebar:#252524;
    --hover:#383835;
    --user-bubble:#383835;
    --composer-border:#454542;
    --shadow:#00000033;
    --accent-ink:#FFFFFF;
    --theme-ink: #F5F5F4;
    --theme-paper: #20201F;
    --theme-panel: #292927;
    --theme-line: #454542;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Inter', sans-serif;
    background:var(--paper);
    color:var(--ink);
    overflow:hidden;
    transition:background .25s ease, color .25s ease;
  }
  h1,h2,h3, .display{
    font-family:'Space Grotesk', sans-serif;
  }
  .app{
    display:grid;
    grid-template-columns: 320px 1fr 300px;
    height:100vh;
    min-height:560px;
    background:var(--paper);
  }
  .app.left-collapsed{grid-template-columns:0 1fr 300px;}
  .app.right-collapsed{grid-template-columns:320px 1fr 0;}
  .app.left-collapsed.right-collapsed{grid-template-columns:0 1fr 0;}
  .app.customize-mode .panel{scroll-behavior:smooth;}
  .app.customize-mode{display:block;overflow:auto;}
  .app.customize-mode .sidebar,.app.customize-mode .main{display:none;}
  .app.customize-mode .panel{display:block;min-height:100vh;border:0;padding:24px 18px 40px;max-width:760px;margin:0 auto;}
  .app.customize-mode .customize-back{display:flex;align-items:center;gap:6px;margin:0 0 18px;padding:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:14px;font-weight:600;cursor:pointer;}
  .app.customize-mode::after{display:none;}
  .credit-notice{
    position:fixed;top:18px;left:50%;z-index:40;
    transform:translate(-50%,-16px);opacity:0;pointer-events:none;
    max-width:min(420px,calc(100% - 28px));
    padding:11px 16px;border:1px solid #B4483A;border-radius:10px;
    background:#FFF0ED;color:#8E2F25;box-shadow:0 8px 24px #0002;
    font-size:13px;font-weight:600;text-align:center;
    transition:opacity .2s ease,transform .2s ease;
  }
  .credit-notice.show{transform:translate(-50%,0);opacity:1;}
  .app.left-collapsed .sidebar,
  .app.right-collapsed .panel{visibility:hidden;}
  .panel-toggle{
    width:32px;height:32px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--paper);
    color:var(--ink);
    cursor:pointer;
    font-size:18px;
    line-height:1;
  }
  .panel-toggle:hover{background:var(--accent);color:var(--accent-ink);}
  .mobile-sidebar-toggle,.mobile-sidebar-close,.mobile-sidebar-backdrop{display:none;}
  .customize-back{display:none;}
  .chat-header .header-actions{display:flex;align-items:center;gap:8px;}
  /* ---------- Sidebar ---------- */
  .sidebar{
    background:var(--sidebar);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    overflow-y:auto;
    min-height:0;
    overscroll-behavior:contain;
    padding:14px 10px;
    transition:width .2s ease, visibility .2s ease;
  }
  .brand{
    padding:8px 12px 22px;
    display:flex;
    align-items:center;
    gap:9px;
  }
  .brand .mark{
    width:27px;height:27px;border-radius:50%;
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    flex:none;overflow:hidden;line-height:1;font-size:15px;
  }
  .brand .name{font-weight:600;font-size:18px;line-height:1.1;}
  .brand .sub{font-size:11px;opacity:.55;margin-top:3px;}
  .editable-field{display:flex;align-items:center;gap:5px;}
  .editable-field input{flex:1;min-width:0;text-align:center;}
  .editable-field input[readonly]{cursor:default;}
  .edit-icon{
    border:0;background:transparent;color:inherit;cursor:pointer;
    opacity:.45;font-size:12px;line-height:1;padding:2px 3px;
  }
  .edit-icon:hover,.edit-icon:focus-visible{opacity:1;color:var(--accent);outline:none;}

  .quick-nav{display:flex;flex-direction:column;gap:2px;margin-bottom:20px;}
  .quick-nav button{
    border:0;background:transparent;color:var(--ink);text-align:left;
    border-radius:8px;padding:10px 12px;font:inherit;font-size:14px;cursor:pointer;
  }
  .quick-nav button:hover,.quick-nav button.active{background:var(--hover);}
  .quick-nav button::first-letter{font-size:16px;}

  .section-label{
    padding:12px 12px 6px;
    font-size:12px;
    font-weight:600;
    opacity:.55;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .section-label button{
    background:none;border:none;cursor:pointer;
    color:var(--ink);opacity:.6;font-size:15px;
    padding:0 4px;
  }
  .section-label button:hover{opacity:1;}

  .list{flex:1;overflow-y:auto;padding-bottom:10px;}
  .item{
    margin:2px 0;
    padding:10px 12px;
    border-radius:8px;
    cursor:pointer;
    font-size:13.5px;
    display:flex;
    align-items:center;
    gap:8px;
    justify-content:space-between;
  }
  .item .it-label{display:flex;align-items:center;gap:8px;overflow:hidden;}
  .item span.txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .item:hover{background:var(--hover);}
  .item.active{background:var(--accent);color:var(--accent-ink);font-weight:600;}
  .item .del{
    opacity:0;border:none;background:none;cursor:pointer;
    color:inherit;font-size:13px;
  }
  .item:hover .del{opacity:.55;}
  .item .del:hover{opacity:1;}

  .persona-dot{
    width:8px;height:8px;border-radius:50%;flex:none;
    background:var(--teal);
  }

  .sidebar-footer{
    border-top:1px solid var(--line);
    padding:14px 12px;
    font-size:11px;
    opacity:.55;
  }
  .list{max-height:150px;}

  .new-chat-btn{
    margin:14px 14px 2px;
    background:var(--accent);
    color:var(--accent-ink);
    border:none;
    border-radius:9px;
    padding:10px 12px;
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .new-chat-btn:hover{background:var(--accent-hover);color:#fff;}

  .proj-dot{
    width:9px;height:9px;border-radius:3px;flex:none;
    background:var(--line);
    cursor:pointer;
  }
  .item.proj-all .proj-dot{background:transparent;border:1.5px solid currentColor;border-radius:3px;}

  .dev-add-row{
    display:flex;gap:6px;
    margin:4px 12px 8px;
  }
  .dev-add-row input{
    flex:1;
    border:1px solid var(--line);
    border-radius:7px;
    padding:6px 8px;
    font-size:12px;
    background:var(--paper);
    color:var(--ink);
  }
  .dev-add-row button{
    border:none;background:var(--accent);color:var(--accent-ink);
    border-radius:7px;padding:0 10px;cursor:pointer;font-weight:600;
  }
  .dev-item{
    margin:2px 10px;
    padding:7px 8px;
    border-radius:7px;
    font-size:12.5px;
    display:flex;
    align-items:center;
    gap:7px;
  }
  .dev-item:hover{background:var(--paper);}
  .dev-status{
    width:9px;height:9px;border-radius:50%;flex:none;cursor:pointer;
  }
  .dev-status.todo{background:var(--line);}
  .dev-status.doing{background:var(--accent);}
  .dev-status.done{background:var(--teal);}
  .dev-item .dev-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dev-item.done .dev-label{opacity:.5;text-decoration:line-through;}
  .dev-item .del{opacity:0;border:none;background:none;cursor:pointer;color:inherit;font-size:12px;}
  .dev-item:hover .del{opacity:.5;}
  .dev-item .del:hover{opacity:1;}

  /* ---------- Main chat ---------- */
  .main{
    display:flex;
    flex-direction:column;
    min-height:0;
    min-width:0;
    position:relative;
    background:var(--paper);
  }
  .chat-header{
    padding:18px 34px;
    border-bottom:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .chat-header .who{display:flex;align-items:center;gap:10px;}
  .chat-header .avatar{
    width:30px;height:30px;border-radius:50%;
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    flex:none;overflow:hidden;line-height:1;font-size:19px;
  }
  .chat-header h2{margin:0;font-size:15px;font-weight:500;}
  .chat-header .persona-name{font-size:11.5px;opacity:.6;margin-top:1px;}

  .credit-pill{
    display:flex;align-items:center;gap:8px;
    font-family:'Roboto Mono', monospace;
    font-size:12.5px;
    background:var(--sidebar);
    border:1px solid var(--line);
    padding:6px 12px;
    border-radius:999px;
  }
  .credit-pill .bar{
    width:64px;height:6px;border-radius:4px;
    background:var(--line);
    overflow:hidden;
  }
  .credit-pill .bar-fill{
    height:100%;
    background:var(--accent);
    transition:width .3s ease;
  }

  .messages{
    flex:1;
    overflow-y:auto;
    min-height:0;
    overscroll-behavior:contain;
    width:min(880px, calc(100% - 48px));
    margin:0 auto;
    padding:42px 0 calc(var(--composer-height, 180px) + 24px);
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .msg{
    max-width:75%;
    padding:13px 16px;
    border-radius:16px;
    font-size:15px;
    line-height:1.5;
    white-space:pre-wrap;
  }
  .msg.user{
    align-self:flex-end;
    background:var(--user-bubble);
    color:var(--ink);
    border-bottom-right-radius:6px;
  }
  .msg.bot{
    align-self:flex-start;
    background:transparent;
    border:0;
    border-bottom-left-radius:6px;
  }
  .msg-header{display:flex;justify-content:flex-end;margin-bottom:6px;}
  .msg-content{white-space:normal;}
  .msg-content p:first-child{margin-top:0;}
  .msg-content p:last-child{margin-bottom:0;}
  .response-actions{
    display:flex;align-items:center;gap:4px;
    margin-top:10px;color:var(--ink);opacity:.55;
  }
  .response-action{
    border:0;background:transparent;color:inherit;
    border-radius:6px;padding:4px 5px;cursor:pointer;
    font:12px/1 'Inter', sans-serif;
  }
  .response-action svg{display:block;width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .response-action:hover,.response-action.active{background:var(--hover);color:var(--accent);opacity:1;}
  .response-time{font-size:10.5px;margin-left:4px;white-space:nowrap;}
  .msg .meta{
    display:block;
    font-size:10.5px;
    opacity:.55;
    margin-top:6px;
    font-family:'Roboto Mono', monospace;
  }
  .empty-state{
    margin:auto;
    text-align:center;
    max-width:520px;
    opacity:.7;
  }
  .empty-state .display{font-size:27px;margin-bottom:10px;font-weight:500;}

  .composer{
    position:absolute;
    left:50%;
    bottom:24px;
    transform:translateX(-50%);
    width:min(880px, calc(100% - 48px));
    border:1px solid var(--composer-border);
    padding:14px 14px 10px;
    border-radius:22px;
    background:color-mix(in srgb, var(--paper) 94%, var(--accent) 6%);
    box-shadow:0 8px 28px var(--shadow);
  }
  .composer-input-row{
    display:flex;
    gap:8px;
    align-items:flex-end;
  }
  .composer-icon,.tool-btn{
    width:32px;height:32px;
    flex:none;
    border:0;
    border-radius:50%;
    background:transparent;
    color:var(--ink);
    cursor:pointer;
    font:500 19px/1 'Space Grotesk', sans-serif;
    opacity:.6;
  }
  .composer-icon svg,.tool-btn svg{display:block;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .send-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .composer-icon:hover,.tool-btn:hover,.tool-btn.active{background:var(--hover);opacity:1;color:var(--accent);}
  .composer-input-row .composer-icon:first-child{margin-bottom:3px;}
  .composer-input-row .composer-icon:nth-last-child(2){margin-bottom:3px;}
  .composer-tools{display:flex;align-items:center;gap:3px;margin-top:8px;}
  .composer-tools .tool-btn{font-size:18px;}
  .tool-spacer{flex:1;}
  .composer-hint{font-size:10px;opacity:.42;white-space:nowrap;padding-right:3px;}
  .model-chips{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    padding-top:9px;
  }
  .model-chip{
    display:inline-flex;align-items:center;gap:7px;
    flex:none;
    border:1px solid transparent;
    border-radius:10px;
    padding:8px 11px;
    background:var(--sidebar);
    color:var(--ink);
    font:500 11.5px 'Inter', sans-serif;
    cursor:pointer;
    white-space:nowrap;
  }
  .model-chip:hover,.model-chip.active{background:var(--hover);border-color:var(--line);}
  .model-chip.active{box-shadow:inset 0 -2px var(--accent);}
  .model-dot{color:var(--accent);font-size:15px;line-height:1;}
  .composer textarea{
    flex:1;
    min-width:0;
    resize:none;
    border:0;
    border-radius:10px;
    padding:8px 5px;
    font-family:inherit;
    font-size:15px;
    background:transparent;
    color:var(--ink);
    max-height:140px;
  }
  .composer textarea:focus{outline:0;}
  .send-btn{
    width:35px;height:35px;
    display:flex;align-items:center;justify-content:center;
    background:var(--accent);
    border:none;
    color:var(--accent-ink);
    font:600 21px/1 'Space Grotesk', sans-serif;
    padding:0;
    border-radius:50%;
    cursor:pointer;
  }
  .send-btn:hover{background:var(--accent-hover);color:#fff;transform:translateY(-1px);}
  .send-btn:disabled{opacity:.4;cursor:not-allowed;}

  /* ---------- Right panel ---------- */
  .panel{
    background:var(--panel);
    border-left:1px solid var(--line);
    overflow-y:auto;
    min-height:0;
    overscroll-behavior:contain;
    padding:20px 18px 30px;
    display:block;
  }
  .panel h3{
    font-size:12px;
    text-transform:none;
    opacity:.55;
    margin:0 0 10px;
    font-weight:600;
  }
  .gauge-wrap{
    display:flex;flex-direction:column;align-items:center;
    padding:14px 0 18px;
    border-bottom:1px solid var(--line);
    margin-bottom:18px;
  }
  .gauge{position:relative;width:128px;height:128px;}
  .gauge svg{transform:rotate(-90deg);}
  .gauge .track{fill:none;stroke:var(--line);stroke-width:10;}
  .gauge .fill{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .4s ease, stroke .3s ease;}
  .gauge-center{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .gauge-center .num{font-family:'Roboto Mono', monospace;font-size:16px;font-weight:500;}
  .gauge-center .lbl{font-size:10px;opacity:.55;margin-top:2px;}
  .low-warning{
    margin-top:10px;font-size:11.5px;color:var(--danger);
    display:none;text-align:center;
  }
  .low-warning.show{display:block;}
  .recharge-btn{
    margin-top:10px;
    background:none;
    border:1px solid var(--accent);
    color:var(--accent);
    font-size:12px;
    padding:6px 12px;
    border-radius:8px;
    cursor:pointer;
    font-weight:600;
  }
  .recharge-btn:hover{background:var(--accent);color:var(--accent-ink);}
  .recharge-btn:disabled{opacity:.4;cursor:not-allowed;}
  .recharge-btn:disabled:hover{background:none;color:var(--accent);}

  .field{margin-bottom:14px;}
  .field label{
    display:block;font-size:11.5px;opacity:.65;margin-bottom:5px;
  }
  .field input[type=text], .field input[type=password], .field select, .field textarea{
    width:100%;
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 10px;
    font-size:13px;
    font-family:inherit;
    background:var(--paper);
    color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:60px;font-size:12.5px;}
  .field input[type=range]{width:100%;accent-color:var(--accent);}
  .range-row{display:flex;justify-content:space-between;font-size:10.5px;opacity:.55;}
  .swatches{display:flex;gap:8px;margin-top:4px;}
  .swatch{
    width:24px;height:24px;border-radius:50%;
    cursor:pointer;border:2px solid transparent;
  }
  .swatch.active{border-color:var(--ink);}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .theme-toggle{
    display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;
  }
  .theme-toggle button{
    border:none;background:var(--paper);color:var(--ink);
    font-size:11.5px;padding:6px 10px;cursor:pointer;
  }
  .theme-toggle button.active{background:var(--accent);color:var(--accent-ink);font-weight:600;}

  .log{
    font-family:'Roboto Mono', monospace;
    font-size:10.5px;
    max-height:120px;
    overflow-y:auto;
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 10px;
    background:var(--paper);
  }
  .log div{display:flex;justify-content:space-between;padding:2px 0;opacity:.75;}

  .divider{height:1px;background:var(--line);margin:18px 0;}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

  @media (max-width: 900px){
    .app,.app.left-collapsed,.app.right-collapsed,.app.left-collapsed.right-collapsed{grid-template-columns:1fr;}
    .app{min-height:100dvh;}
    .sidebar, .panel{display:none;}
    .mobile-sidebar-toggle{display:block;width:32px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);cursor:pointer;font-size:18px;line-height:1;}
    .mobile-sidebar-close{display:block;position:absolute;top:14px;right:14px;border:0;background:transparent;color:var(--ink);font-size:26px;line-height:1;cursor:pointer;z-index:1;}
    .app.mobile-sidebar-open .sidebar{display:flex;visibility:visible;position:fixed;inset:0 auto 0 0;width:min(320px,88vw);z-index:20;box-shadow:8px 0 24px var(--shadow);}
    .app.mobile-sidebar-open .mobile-sidebar-backdrop{display:block;position:fixed;inset:0;z-index:19;border:0;background:#0006;cursor:default;}
    .panel-toggle{display:none;}
    .messages,.composer{width:calc(100% - 28px);}
    .composer{bottom:16px;}
    .composer-hint{display:none;}
    .composer{padding:11px 10px 8px;}
    .app.customize-mode .panel{min-height:100dvh;max-width:none;}
    .credit-notice{top:12px;}
  }
</style>
{% block extra_head %}{% endblock %}
</head>
<body data-theme="light">
{% block body %}
{% endblock %}
<script>
(function(){
  const accents = ["#E8A33D", "#3F8E8A", "#B4483A", "#6C6FCB", "#4E9F3D"];
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem("ai2ai-appearance") || "null"); } catch (error) {}
  const accent = saved && accents.includes(saved.accent) ? saved.accent : accents[0];
  const value = accent.slice(1);
  const channel = index => parseInt(value.slice(index, index + 2), 16);
  const luminance = (0.299 * channel(0) + 0.587 * channel(2) + 0.114 * channel(4)) / 255;
  const ink = luminance > 0.62 ? "#211914" : "#FFFFFF";
  const darkened = "#" + [0, 2, 4].map(index =>
    Math.max(0, Math.round(channel(index) * 0.84)).toString(16).padStart(2, "0")
  ).join("");
  document.documentElement.style.setProperty("--accent", accent);
  document.documentElement.style.setProperty("--accent-hover", darkened);
  document.documentElement.style.setProperty("--accent-ink", ink);
  document.body.setAttribute("data-theme", saved && ["light", "dark"].includes(saved.theme) ? saved.theme : "light");
})();
