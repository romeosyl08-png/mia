{% load static %}
<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#6C6FCB">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="2AI">
<link rel="manifest" href="{% url 'pwa-manifest' %}">
<link rel="apple-touch-icon" href="{% static 'app/pwa/apple-touch-icon.png' %}">
<link rel="icon" type="image/png" sizes="192x192" href="{% static 'app/pwa/icon-192.png' %}">
<title>{% block title %}2AI — assistant IA personnalisable{% endblock %}</title>
<link id="botFavicon" rel="icon" type="image/svg+xml">
<script src="{% static 'app/js/theme.js' %}?v=frontend-1"></script>
<link rel="stylesheet" href="{% static 'app/css/base.css' %}?v=frontend-1">
<link rel="stylesheet" href="{% static 'app/css/pwa.css' %}?v=frontend-1">
{% block extra_head %}
{% endblock %}
</head>
<body class="{% block body_class %}page{% endblock %}" {% block body_attributes %}data-keep-title{% endblock %}>
{% block body %}
{% endblock %}
{% block install_controls %}{% include "includes/pwa_controls.html" %}{% endblock %}
    <script defer src="{% static 'app/js/appearance.js' %}?v=frontend-1"></script>
    <script defer src="{% static 'app/js/pwa.js' %}?v=frontend-1"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
