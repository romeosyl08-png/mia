{% extends "base.html" %}
{% load static %}
{% block title %}{{ file.original_name }} — {{ workspace.title }}{% endblock %}
{% block extra_head %}
<link rel="stylesheet" href="{% static 'app/css/file_editor.css' %}?v=frontend-1">
{% endblock %}
{% block body %}
<div class="editor-wrap">
  <div class="editor-header">
    <div>
      <a href="{% url 'bara:detail' workspace.id %}">‹ {{ workspace.title }}</a>
      <h1>{{ file.original_name }}</h1>
    </div>
  </div>
  <form id="editor-form" method="post" style="flex:1;display:flex;flex-direction:column;">
    {% csrf_token %}
    <textarea id="editor-textarea" name="content" spellcheck="false">{{ file.extracted_text }}</textarea>
    <div class="editor-actions">
      <span id="save-status"></span>
      <button type="submit" id="save-btn">Enregistrer</button>
    </div>
  </form>
</div>

{% endblock %}
{% block extra_js %}
<script defer src="{% static 'app/js/file_editor.js' %}?v=frontend-1"></script>
{% endblock %}
